<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Định dạng văn bản</title>
    </head>

    <body>

        <!-- Tiêu đề chính -->
        <h1 style="color: blue; text-align: center;">
            HTML Text Formatting
        </h1>

        <!-- Đoạn văn bản có kích thước 18px -->
        <p style="font-size: 18px;">
            HTML cho phép bạn định dạng văn bản một cách dễ dàng.
        </p>

        <!-- Các kiểu định dạng chữ -->
        <p>
            <b>Chữ in đậm</b>,
            <i>chữ in nghiêng</i>,
            <u>chữ gạch chân</u>.
        </p>

        <!-- Đoạn văn bản màu đỏ -->
        <p style="color: red;">
            Đoạn văn bản này có màu đỏ.
        </p>

        <!-- Văn bản căn giữa và sử dụng font Arial -->
        <p style="text-align: center; font-family: Arial, sans-serif;">
            Đây là một đoạn văn bản căn giữa với font chữ Arial.
        </p>

        <!-- Danh sách có màu xanh lá và chữ đậm -->
        <ul style="color: green; font-weight: bold;">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

    </body>
</html>
