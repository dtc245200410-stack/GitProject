<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào trang HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal-text {
            color: blue;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Nhúng CSS vào trang HTML</h1>

    <!-- Phần 1: Inline CSS -->
    <p style="color: red;">
        Đây là đoạn văn sử dụng Inline CSS, màu chữ đỏ.
    </p>

    <!-- Phần 2: Internal CSS -->
    <p class="internal-text">
        Đây là đoạn văn sử dụng Internal CSS, màu chữ xanh dương.
    </p>

    <!-- Phần 3: External CSS -->
    <p class="external-text">
        Đây là đoạn văn sử dụng External CSS, màu chữ xanh lá.
    </p>
</body>
</html>
